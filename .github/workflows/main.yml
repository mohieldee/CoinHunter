
name: Build CoinHunter APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'CoinHunter_v87.html'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp CoinHunter_v87.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "coinhunter",
            "version": "1.0.0",
            "private": true,
            "description": "CoinHunter Android App"
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.coinhunter.app",
            "appName": "CoinHunter",
            "webDir": "www"
          }
          EOF
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinHunter-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
